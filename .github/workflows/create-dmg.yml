name: Build and Release macOS App

on:
  push:
    branches: [master]
    tags:
      - 'v*'

env:
  APP_NAME: NextPaste
  BUILD_PATH: build
  SCHEME: NextPaste
  PROJECT: NextPaste.xcodeproj

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0' # Replace with your required SemVer

      - name: Generate version from git tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="1.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Install certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "Warning: Certificate not provided. Building without code signing."
            exit 0
          fi
          echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "Certificate installed successfully"

      - name: Setup Node.js for appdmg
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Build and Archive macOS app
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd $GITHUB_WORKSPACE
          ls -la
          pwd
          
          # Verify project exists
          if [ ! -d "$PROJECT" ]; then
            echo "Error: Xcode project not found at $PROJECT"
            ls -la
            exit 1
          fi
          
          # Create archive using Xcode's archive process (Universal Binary - ARM64 + x86_64)
          xcodebuild -scheme $SCHEME \
            -project $PROJECT \
            -configuration Release \
            -derivedDataPath $BUILD_PATH \
            -archivePath $BUILD_PATH/NextPaste.xcarchive \
            archive \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            VALID_ARCHS="arm64 x86_64" \
            SUPPORTED_PLATFORMS="macosx" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # Export archive to get the .app file
          xcodebuild -exportArchive \
            -archivePath $BUILD_PATH/NextPaste.xcarchive \
            -exportPath $BUILD_PATH/Export \
            -exportOptionsPlist /dev/stdin \
            <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>method</key>
            <string>mac-application</string>
            <key>archiveExportOptions</key>
            <dict>
              <key>signingStyle</key>
              <string>automatic</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          echo "Archive created successfully"
          
          # Verify archive contains universal binary
          echo "Checking archive contents:"
          find $BUILD_PATH/NextPaste.xcarchive/Products -name "$APP_NAME" -type f
          
          ARCHIVED_APP=$(find $BUILD_PATH/NextPaste.xcarchive/Products -name "$APP_NAME" -type f | head -1)
          if [ -n "$ARCHIVED_APP" ]; then
            echo "Archive app architecture:"
            file "$ARCHIVED_APP"
            lipo -info "$ARCHIVED_APP"
          fi
          
          # Verify universal binary
          BUILT_APP=$(find $BUILD_PATH/Export -name "$APP_NAME.app" -type d | head -1)
          if [ -n "$BUILT_APP" ]; then
            echo "Checking architecture of built app:"
            file "$BUILT_APP/Contents/MacOS/$APP_NAME"
          fi

      - name: Locate and sign the app
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          echo "Build directory contents:"
          find $BUILD_PATH -type d -name "*.app" 2>/dev/null || true
          
          # Find the exported app from archive
          APP_PATH=$(find $BUILD_PATH/Export -name "$APP_NAME.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App not found in export directory"
            echo "Searching for any .app files:"
            find $BUILD_PATH -type d -name "*.app" 2>/dev/null || true
            echo "Full build directory structure:"
            find $BUILD_PATH -type d | head -30 || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH")"
          
          # Verify it's a universal binary
          echo "Verifying architecture (should show both arm64 and x86_64):"
          file "$APP_PATH/Contents/MacOS/$APP_NAME"
          
          # Check with lipo as well
          echo "Detailed architecture check:"
          lipo -info "$APP_PATH/Contents/MacOS/$APP_NAME" || echo "Not a universal binary - checking current arch:"
          
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          
          # Sign if certificate is available
          if [ -n "$TEAM_ID" ]; then
            echo "Signing app..."
            # Sign all dylibs
            find "$APP_PATH" -type f -name "*.dylib" -print0 | xargs -0 codesign --force --options runtime --sign "Developer ID Application: $TEAM_ID" 2>/dev/null || true
            # Sign the main executable
            codesign --force --deep --options runtime --sign "Developer ID Application: $TEAM_ID" "$APP_PATH"
            echo "App signed successfully"
          fi

      - name: Create DMG
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          DMG_NAME="${APP_NAME}-${VERSION}.dmg"
          DMG_PATH="$DMG_NAME"
          
          echo "Creating DMG: $DMG_PATH"
          
          # Copy app to temp location for DMG
          cp -r "$APP_PATH" ./$APP_NAME.app
          
          # Create a simple DMG with hdiutil if appdmg config doesn't exist
          if [ ! -f "dmgInfo.json" ]; then
            mkdir -p dmg-temp
            cp -r ./$APP_NAME.app dmg-temp/
            hdiutil create -volname "$APP_NAME" -srcfolder dmg-temp -ov -format UDZO "$DMG_PATH"
            rm -rf dmg-temp
          else
            appdmg dmgInfo.json "$DMG_PATH"
          fi
          
          # Sign DMG if certificate is available
          if [ -n "$TEAM_ID" ]; then
            codesign --force --sign "Developer ID Application: $TEAM_ID" "$DMG_PATH" --timestamp
          fi
          
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV
          ls -lh "$DMG_PATH"

      - name: Create app zip archive
        run: |
          ZIP_NAME="${APP_NAME}-${VERSION}.zip"
          echo "Creating zip: $ZIP_NAME"
          ditto -c -k --sequesterRsrc "./$APP_NAME.app" "$ZIP_NAME"
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV
          ls -lh "$ZIP_NAME"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "Warning: Apple ID credentials not provided. Skipping notarization."
            exit 0
          fi
          
          echo "Notarizing app..."
          xcrun notarytool store-credentials "notary-profile" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --overwrite
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notary-profile" --wait
          xcrun stapler staple "$DMG_PATH"
          echo "App notarized and stapled successfully"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_PATH }}
          path: ${{ env.DMG_PATH }}
          retention-days: 30

      - name: Create Release and Upload Files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
